<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль — CineLib</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/static/index.html" class="logo">CineLib</a>
            <nav class="site-nav">
                <ul>
                    <li><a href="/static/index.html">Главная</a></li>
                    <li><a href="/static/catalog.html">Каталог</a></li>
                    <li class="nav-favorites"><a href="/static/favorites.html">Избранное</a></li>
                    <li><a href="/static/map.html">Кинотеатры</a></li> 
                    <li><a href="/static/contacts.html">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <div class="container profile-container">
            <h1>Профиль</h1>
            <p class="intro">Здесь хранятся твои данные. Они сохраняются только в этом браузере и не отправляются на сервер.</p>

            <form class="profile-form" id="profile-form">
                <div class="field">
                    <label for="profile-name">Ник</label>
                    <input type="text" id="profile-name" name="name" placeholder="Как к тебе обращаться" minlength="2" maxlength="40" required>
                </div>
                <div class="field">
                    <label for="profile-email">Электронная почта</label>
                    <input type="email" id="profile-email" name="email" placeholder="name@example.com" required>
                </div>
                <div class="field">
                    <label for="profile-password">Пароль</label>
                    <input type="password" id="profile-password" name="password" placeholder="Минимум 6 символов" minlength="6" required>
                </div>
                <button type="submit" class="btn">Сохранить профиль</button>
                <button type="button" class="btn btn-outline" id="logout-btn" style="margin-top: 16px; width: 100%;">Выйти из аккаунта</button>
                <p class="meta" id="profile-status"></p>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p class="slogan">CineLib — кино, которое остаётся с тобой</p>
            <p>© CineLib, 2026 · Учебный проект</p>
        </div>
    </footer>

    <script src="/static/app.js" defer></script>

    <div id="auth-modal" class="auth-modal" hidden>
        <div class="auth-modal-overlay"></div>
        <div class="auth-modal-content">
            <button class="auth-modal-close" aria-label="Закрыть">✕</button>
            
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>
            
            <!-- Форма входа -->
            <form id="login-form" class="auth-form">
                <h2>Вход в аккаунт</h2>
                <div class="field">
                    <label for="login-email">Электронная почта</label>
                    <input type="email" id="login-email" required placeholder="name@email.com">
                </div>
                <div class="field">
                    <label for="login-password">Пароль</label>
                    <input type="password" id="login-password" required placeholder="Минимум 6 символов">
                </div>
                <button type="submit" class="btn">Войти</button>
                <p class="auth-status"></p>
            </form>
            
            <!-- Форма регистрации -->
            <form id="register-form" class="auth-form" hidden>
                <h2>Регистрация</h2>
                <div class="field">
                    <label for="register-name">Ник</label>
                    <input type="text" id="register-name" required placeholder="Минимум 2 символа">
                </div>
                <div class="field">
                    <label for="register-email">Электронная почта</label>
                    <input type="email" id="register-email" required placeholder="name@email.com">
                </div>
                <div class="field">
                    <label for="register-password">Пароль</label>
                    <input type="password" id="register-password" required placeholder="Минимум 6 символов">
                </div>
                <button type="submit" class="btn">Зарегистрироваться</button>
                <p class="auth-status"></p>
            </form>
        </div>
    </div>
</body>
</html>
